<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Vision Skills architecture: input to structured JSON through classify, route, providers, normalize, scene graph, and compose">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Vision Skills — analysis pipeline</text>
  <text x="380" y="52" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6b7280">images → structured JSON for LLMs and agents</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Stage 1: Input -->
  <rect x="24" y="80" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="104" y="103" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">Input</text>
  <text x="104" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#3b82f6">path · URL · data URI · buffer</text>

  <!-- Stage 2: Preprocess -->
  <rect x="216" y="80" width="160" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="296" y="103" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9">Preprocess</text>
  <text x="296" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#8b5cf6">decode · validate · resize · hash</text>

  <!-- Stage 3: Classify + Route -->
  <rect x="408" y="80" width="160" height="52" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="488" y="103" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#047857">Classify + Route</text>
  <text x="488" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#10b981">image type → mode policy</text>

  <!-- Stage 4: Cache -->
  <rect x="600" y="80" width="136" height="52" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="668" y="103" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">Cache</text>
  <text x="668" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ef4444">TTL backend · injectable</text>

  <line x1="184" y1="106" x2="216" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="376" y1="106" x2="408" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="568" y1="106" x2="600" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="668" y1="132" x2="668" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Providers -->
  <rect x="24" y="160" width="712" height="150" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="40" y="182" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6b7280">PROVIDERS (mode-gated)</text>

  <rect x="40" y="196" width="156" height="98" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="118" y="218" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Gemini OCR</text>
  <text x="118" y="236" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">tables · regions · code</text>
  <text x="118" y="252" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">layout · key rotation</text>

  <rect x="212" y="196" width="156" height="98" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="290" y="218" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Gemini Detection</text>
  <text x="290" y="236" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">objects · bboxes</text>
  <text x="290" y="252" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">combined analysis pass</text>

  <rect x="384" y="196" width="156" height="98" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="462" y="218" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803d">Rule-Based UI</text>
  <text x="462" y="236" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e">local · free · no API</text>
  <text x="462" y="252" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e">buttons · fields · menus</text>

  <rect x="556" y="196" width="164" height="98" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="638" y="218" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b45309">Gemini VLM</text>
  <text x="638" y="236" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b">semantic relationships</text>
  <text x="638" y="252" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b">reasoner (fable-style)</text>

  <!-- Normalize -->
  <rect x="24" y="350" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="104" y="373" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">Normalize</text>
  <text x="104" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#3b82f6">labels · bbox · dedupe</text>

  <!-- Scene graph -->
  <rect x="216" y="350" width="160" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="296" y="373" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9">Scene Graph</text>
  <text x="296" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#8b5cf6">spatial · semantic · hierarchy</text>

  <!-- Compose -->
  <rect x="408" y="350" width="160" height="52" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="488" y="373" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#047857">Compose</text>
  <text x="488" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#10b981">confidence · provenance · telemetry</text>

  <!-- Output -->
  <rect x="600" y="350" width="136" height="52" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="668" y="373" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">JSON v3.1.0</text>
  <text x="668" y="390" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ef4444">SDK · MCP · REST</text>

  <line x1="668" y1="310" x2="668" y2="350" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="184" y1="376" x2="216" y2="376" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="376" y1="376" x2="408" y2="376" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="568" y1="376" x2="600" y2="376" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Interfaces -->
  <text x="380" y="456" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#374151">Interfaces</text>
  <rect x="120" y="468" width="120" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="180" y="489" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#4338ca">SDK</text>
  <rect x="260" y="468" width="120" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="320" y="489" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#4338ca">MCP server</text>
  <rect x="400" y="468" width="120" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="460" y="489" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#4338ca">REST server</text>
  <rect x="540" y="468" width="120" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="600" y="489" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#4338ca">CLI + daemon</text>
</svg>
